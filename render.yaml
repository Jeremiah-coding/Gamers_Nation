databases:
  - name: gamers-nation-db
    databaseName: gamers_nation
    user: gamers_nation
    region: ohio
    plan: 0.1c-256mb
    postgresMajorVersion: "16"
    connectionPool: pgbouncer

services:
  - type: web
    name: gamers-nation
    runtime: python
    region: ohio
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: DB_BACKEND
        value: postgres
      - key: DATABASE_URL
        fromDatabase:
          name: gamers-nation-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: TEMPEST_ADMIN_PASSCODE
        sync: false
